name: Deploy

# Builds the app and deploys it over SSH to maximum.tasks-manage.com:
# rsync uploads only what changed, then scripts/remote-deploy.sh runs
# migrations and rebuilds Laravel's caches on the server.
#
# One repository secret (Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY   private key whose public half is authorised in the N0C panel (SSH → Keys)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_HOST: node32-ca.n0c.com
  SSH_PORT: '5022'
  SSH_USER: jgasauvc
  APP_DIR: /home/jgasauvc/maximum-momentum

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://maximum.tasks-manage.com

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, fileinfo, gd
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run typecheck

      - name: Build assets
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2> /dev/null
          {
            echo "Host production"
            echo "  HostName $SSH_HOST"
            echo "  Port $SSH_PORT"
            echo "  User $SSH_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config

      - name: Upload release
        run: |
          git rev-parse HEAD > .deployed-commit
          # Excluded paths are also protected from --delete: the server's .env,
          # uploads in storage/, the public/storage link and Laravel's caches stay.
          rsync -az --delete --stats \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/resources/js/' \
            --exclude='/resources/css/' \
            --exclude='/tests/' \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/storage/' \
            --exclude='/bootstrap/cache/*.php' \
            --exclude='/database/database.sqlite' \
            --exclude='/public/storage' \
            --exclude='/public/hot' \
            --exclude='/public/images/WhatsApp*' \
            --exclude='*.md' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/tsconfig.json' \
            --exclude='/vite.config.ts' \
            --exclude='/phpunit.xml' \
            ./ production:"$APP_DIR/"

      - name: Migrate and rebuild caches
        run: ssh production "bash $APP_DIR/scripts/remote-deploy.sh"

      - name: Smoke test
        run: |
          for path in / /admin/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://maximum.tasks-manage.com$path")
            echo "$path → $code"
            [ "$code" = "200" ]
          done
